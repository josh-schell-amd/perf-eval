# Kimi-K3 on AMD MI355X
# Recipe: https://recipes.vllm.ai/moonshotai/Kimi-K3
# K3 needs at least 8x MI355X/MI350X on ROCm (8x GB300 on NVIDIA) — there is
# no H200 profile, the 2.8T model does not fit on Hopper.
# Env and serve args match the recipe's MI355X docker command;
# VLLM_USE_BREAKABLE_CUDAGRAPH=0 is required.
name: kimi_k3-mi355x
gpu: MI355X
num_gpus: 8
nightly: true

vllm:
  model: moonshotai/Kimi-K3
  # No image: like the other workloads, default to the nightly under test
  # (K3 support is in current nightlies).
  env:
    VLLM_ROCM_USE_AITER: 1
    SAFETENSORS_FAST_GPU: 1
    VLLM_ROCM_USE_AITER_MOE_SITUV2: 1
    VLLM_USE_BREAKABLE_CUDAGRAPH: 0
    VLLM_ROCM_AITER_MLA_ASM_PADDING: asm
    VLLM_ROCM_AITER_MLA_DCP_VERIFY: asm
    AITER_FLYDSL_STAGE2_FP8: 1
    VLLM_USE_RUST_FRONTEND: 1
  # serve_args is word-split without shell quoting: keep JSON values unquoted
  # and free of spaces. --load-format auto overrides the profile default.
  serve_args: >-
    --trust-remote-code
    --tensor-parallel-size 8
    --load-format auto
    --mm-encoder-tp-mode data
    --max-num-seqs 128
    --max-num-batched-tokens 4096
    --compilation-config {"cudagraph_mode":"FULL_DECODE_ONLY","custom_ops":["+fused_rms_norm_gated"]}
    --gpu-memory-utilization 0.9
    --max-model-len 1048576
    --enable-prefix-caching
    --kv-cache-dtype fp8
    --attention-config {"mla_prefill_backend":"ROCM_AITER_FA"}
    --stream-interval 10
    --enable-auto-tool-choice
    --tool-call-parser kimi_k3
    --reasoning-parser kimi_k3

lm_eval:
  model_args:
    tokenized_requests: false
    tokenizer_backend: null
    timeout: 6000
  tasks:
    - name: gsm8k
      num_fewshot: 5
      model_args:
        num_concurrent: 64
        max_length: 40960
        max_gen_toks: 32768

vllm_bench:
  metadata:
    # The default K3 checkpoint is MXFP4; the repo name has no precision marker.
    precision: mxfp4
  configs:
    - name: 8k-in-1k-out
      backend: openai
      dataset: random
      input_len: 8192
      output_len: 1024
      num_prompts: 512
      max_concurrency: 128
    - name: 1k-in-1k-out
      backend: openai
      dataset: random
      input_len: 1024
      output_len: 1024
      num_prompts: [10, 256, 512]
      max_concurrency: [1, 64, 128]
      speed_bench_dataset_subset: throughput_8k
      speed_bench_category: low_entropy

aiperf:
  configs:
    - name: prefix63k-in4760-out350-conc16-24
      args:
        endpoint-type: chat
        streaming: true
        use-server-token-count: true
        tokenizer-trust-remote-code: true
        num-prefix-prompts: 8
        prompt-prefix-length: 63240
        synthetic-input-tokens-mean: 4760
        synthetic-input-tokens-stddev: 0
        output-tokens-mean: 350
        output-tokens-stddev: 0
        extra-inputs:
          - "ignore_eos:true"
          - "min_tokens:350"
          - "max_tokens:350"
        warmup-request-count: 3
        sweep-type: zip
        concurrency: "16,24"
        request-count: "80,120"
        random-seed: 42
        ui: simple
